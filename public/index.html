<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="AI Problem Solving Assignment - Interactive Tic-Tac-Toe and Crypt Arithmetic Solver"
    />
    <title>AI Problem Solving - Tic-Tac-Toe & Crypt Arithmetic</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      body {
        background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        min-height: 100vh;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* Loading spinner */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto';
        color: #666;
      }

      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-top: 4px solid #0066cc;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-right: 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        .loading {
          color: #aaa;
        }

        .spinner {
          border-color: rgba(255, 255, 255, 0.1);
          border-top-color: #3399ff;
        }
      }

      /* Fallback for very old browsers */
      noscript {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #d32f2f;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div>
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled.</p>
        <p>Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>

    <div id="root">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading AI Problem Solving...</div>
      </div>
    </div>

    <!-- React and dependencies are loaded by react-scripts during build -->
  </body>
</html>
